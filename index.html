      name="description"
      content="Estudo e simulação do exame oficial CILS B1 Cittadinanza (Università per Stranieri di Siena): escuta, leitura, escrita e oral."
    />

    <title>CILS B1 Cittadinanza — Prep</title>
    <script>
      /*
       * Aplica o tema ANTES de o React montar (evita o "flash" branco quando a
       * aluna usa o tema escuro). Mesma chave e mesma regra de
       * `src/lib/theme.ts`.
       */
      ;(function () {
        try {
          var stored = window.localStorage.getItem('cils.theme')
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          root.dataset.theme = dark ? 'dark' : 'light'
        } catch (error) {
          /* sem localStorage: fica o tema do sistema */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
